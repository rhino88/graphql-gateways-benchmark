on:
  workflow_call:
    inputs:
      scenarioName:
        type: string
        required: true

jobs:
  report:
    runs-on: ubuntu-24.04
    name: report
    permissions: write-all
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: download artifacts
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: ${{ inputs.scenarioName }}_*

      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: generate report
        run: |
          {
            echo "## Query planning"
            echo
            echo "Each query is sent twice per iteration by a single VU: once with a document the gateway has already cached (warm) and once with a never-seen-before document (unique operation name and aliases, cold)."
            echo "**Planning overhead** is the paired \`cold - warm\` latency: the time spent parsing, validating, normalizing and query planning a new operation."
            echo
            cargo run -q -p toolkit planning-summary ${{ steps.download.outputs.download-path }}
          } > result.md
        env:
          SCENARIO_ARTIFACTS_PREFIX: ${{ inputs.scenarioName }}_

      - name: publish report (pull_request)
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3
        if: github.event_name == 'pull_request'
        with:
          header: ${{ inputs.scenarioName }}
          path: result.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: update summary
        run: cat result.md >> $GITHUB_STEP_SUMMARY && mv result.md ${{ inputs.scenarioName }}_result.md

      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: publish report (workflow_dispatch/push)
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          add: ${{ inputs.scenarioName }}_result.md
          message: "Update results for scenario: ${{ inputs.scenarioName }}"
          pull: "--rebase --autostash"
          author_email: github-actions@github.com
          author_name: github-actions
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: ${{ inputs.scenarioName }}-report
          path: ${{ inputs.scenarioName }}_result.md
